[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
  "poetry-core",
]

[tool.poetry]
name = "rollout-fabric"
version = "0.1.0"
description = "RolloutFabric: a contract-first agentic RL training fabric"
authors = [ "Pluralis AI" ]
license = "MIT"
readme = "README.md"
# Fabric-core only — no openhands, no GPU, no LLM deps.
# For the EnvironmentProvider (ProRL / OpenHands):  cd openhands && poetry install
# For vLLM pool (EC2 remote):                       pip install -r scripts/inference/requirements-remote.txt
# For TrainerAdapter (VERL / slime / ROLL):         pip install -e trainer_integration/{trainer}/ (inside Docker)
package-mode = false

[tool.poetry.dependencies]
# LiveStore · PolicyRegistry · ReplayArchive · RolloutManager · schemas
python = "^3.12,<3.14"
grpcio = ">=1.60.0"              # gRPC transport for all fabric services
protobuf = "^4.21.6,<5.0.0"     # schemas/_gen/ compiled bindings; chromadb fails on >=5
pyarrow = "20.0.0"               # ReplayArchive (parquet) + RolloutManager (parquet loader)
httpx = "*"                      # RolloutManager → prorl_client.py HTTP calls
requests = "*"                   # PolicyRegistry → fanout.py HTTP calls

[tool.poetry.group.dev.dependencies]
grpcio-tools = ">=1.60.0"        # proto code generation: make protos / bash scripts/gen_protos.sh
ruff = "0.11.11"
mypy = "1.15.0"
pre-commit = "4.2.0"
build = "*"
types-setuptools = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
pytest-forked = "*"
pytest-xdist = "*"
openai = "*"
pandas = "*"
gevent = ">=24.2.1,<26.0.0"

[tool.poetry-dynamic-versioning]
enable = true
style = "semver"

[tool.autopep8]
# autopep8 fights with mypy on line length issue
ignore = [ "E501" ]

[tool.black]
# prevent black (if installed) from changing single quotes to double quotes
skip-string-normalization = true

[tool.ruff]
lint.select = [ "D" ]
# ignore warnings for missing docstrings
lint.ignore = [ "D1" ]
lint.pydocstyle.convention = "google"

[tool.coverage.run]
concurrency = [ "gevent" ]
