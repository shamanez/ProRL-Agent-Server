[pytest]
addopts = -p no:warnings
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    invariant: §3.x regression gates for the rollout-fabric invariants
    contract: §A.x slot-protocol contract tests
    integration: hits a real external service (network, sandbox, subprocess)
    real_data: depends on local datasets that may be absent on dev laptops
    slow: single-test wall clock > 10s
