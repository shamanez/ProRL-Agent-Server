[mypy]
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
explicit_package_bases = True
warn_unreachable = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True

# Pre-existing type errors in upstream OpenHands modules — not our code.
[mypy-environments.prorl_openhands.openhands.agenthub.*]
ignore_errors = True

[mypy-environments.prorl_openhands.openhands.server.conversation_manager.*]
ignore_errors = True

[mypy-environments.prorl_openhands.openhands.security.invariant.*]
ignore_errors = True
